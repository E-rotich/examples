<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="co.css">
</head>
<body>
    <div class="container">
        <h1>Color Palate Generator</h1>
        <button id="generate-btn">
           <i class="fas fa-sync-alt"></i>
            Generate Palatee
        </button>
        <div class="palette-container">
            <!--1-->
            <div class="color-box">
                <div class="color" style="background-color: #e1f5fe;"></div>
                <div class="color-info">
                    <span class="hex-value">#e1f5fe</span>
                    <button class="far fa-copy copy-btn" title="Copy to clipboard"></button>
                </div>
         </div>
             <!--2-->
              <div class="color-box">

                </div>
            </div>
              <!--3-->
               <div class="color-box">

                </div>
                </div>
               <!--4-->
                <div class="color-box">

                <div class="color-info">
                    <span class="hex-value">#e1f5fe</span>

                </div>
                <!--5-->
                 <div class="color-box">

                </div>
                </div>
        </div>
    </div>
    <script src="co.js"></script>
</body>
</html>
