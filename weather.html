<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-box">
                <input type="text" placeholder="enter your location" class="input-box">
                <button id="searchBtn">ent</button>
            </div>
        </div>
        <div class="weather-body">
            <img src="/checkmark-svgrepo-com.svg" alt="weather image" class="weather-img">
            <div class="weather-box">
                <p class="temperature">0 degri</p>
                <p class="description">Light Rain</p>
            </div>
            <div class="weather-details">
                <div class="humidity">
                    <img src="https://plus.unsplash.com/premium_photo-1675968514495-7f3be70dddd6?q=80&w=1016&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" class="humidity">
                    <div class="text">
                        <span id="humidity">45%</span>
                        <p>humidity</p>
                    </div>
                </div>

                 <div class="wind">
                    <img src="https://images.unsplash.com/photo-1531420780994-e74b1a80952e?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aWNvbnMlMjB3aW5kfGVufDB8fDB8fHww" class="wind">
                    <div class="text">
                        <span id="wind-speed">12km/h</span>
                        <p>windspeed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="weather.js"></script>
</body>
</html>
