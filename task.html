<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="task.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>
                <i class="fas fa-check-circle"></i>
                My Tasks
            </h1>
            <p id="date"></p>
        </header>
        <div class="todo-input">
            <input type="text" id="task-input" placeholder="what you need to do"/>
            <button id="add-task">
            <i class="fas fa-plus"></i>
        </button>
        </div>
        <div class="filters">
            <span class="filter active" data-filter="all">  All </span>
            <span class="filter" data-filter="active">  Active</span>
            <span class="filter" data-filter="completed">Completed </span>
        </div>
        <div class="todos-container">
            <ul id="todos-list">
                <!--list here-->
                <li class="todo-item">
                    <label class="checkbox-container">
                        <input type="checkbox" class="todo-checkbox"/>
                        <span class="checkmark"></span>
                    </label>
                    <span class="todo-item-text">Buy groceries</span>
                    <button class="delete-btn">delete</button>
                </li>
            </ul>
            <div class="empty-state hidden">
                <i class="fas fa-clipboard-list"></i>
                <p>no task here</p>
            </div>
        </div>
        <footer>
            <p id="items-left">0 items left</p>
            <button id="clear-completed">Clear completed</button>
        </footer>

    </div>
    <script src="task.js"></script>
</body>
</html>
